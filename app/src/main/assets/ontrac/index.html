<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>OnTrac</title>
  <style>
    :root {
      --bg: #0a0d12; --card: #141a22; --line: #283140; --text: #f0f4f8;
      --mute: #8b97a8; --ok: #3dd68c; --accent: #5b9fd4; --fire: #e8a045;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; padding: 16px 14px 40px; line-height: 1.45;
    }
    .brand { font-size: 0.65rem; letter-spacing: 0.18em; color: var(--accent); font-weight: 800; }
    h1 { font-size: 1.35rem; margin: 8px 0 4px; font-weight: 700; }
    .tagline { color: var(--mute); font-size: 0.88rem; margin-bottom: 14px; }
    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    }
    .label { font-size: 0.6rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); }
    button {
      border: none; border-radius: 12px; padding: 14px 16px;
      font-weight: 800; font-size: 0.95rem; width: 100%;
    }
    .primary {
      background: linear-gradient(180deg, #6aade0, #3d7eb0);
      color: #061018; margin-top: 8px;
    }
    .secondary {
      background: transparent; color: var(--text); border: 1px solid var(--line);
      font-weight: 600; margin-top: 8px;
    }
    .case-row {
      padding: 12px 0; border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .case-row:last-child { border-bottom: none; }
    .case-title { font-weight: 650; font-size: 0.95rem; }
    .case-meta { color: var(--mute); font-size: 0.78rem; margin-top: 2px; }
    .empty { color: var(--mute); font-size: 0.9rem; padding: 8px 0; }
    .poem {
      font-size: 0.8rem; color: var(--mute); font-style: italic;
      border-left: 3px solid var(--fire); padding: 8px 0 8px 12px; margin: 8px 0 16px;
    }
    .foot { margin-top: 16px; font-size: 0.72rem; color: #5a6575; text-align: center; }
  </style>
</head>
<body>
  <div class="brand">ONTRAC · WD2</div>
  <h1>Your cases</h1>
  <p class="tagline">Stored on this device. Survive app kill. One button when you open a case.</p>
  <div class="poem">
    The wall does not get to reset when the app closes.<br/>
    Neither does your progress.
  </div>

  <div class="card">
    <div class="label">Open or resume</div>
    <div id="list"></div>
    <button type="button" class="primary" id="btnNew">Start tax recovery case</button>
    <button type="button" class="secondary" id="btnExport">Export all consent logs</button>
    <button type="button" class="secondary" id="btnRules">Review rules again</button>
  </div>

  <p class="foot">Cubit · Durable cases · Representation through consent</p>

  <script>
(function () {

  // WD2 first-run gate
  (function () {
    try {
      if (!localStorage.getItem("ontrac_onboarding_v1")) {
        location.replace("onboarding.html");
        return;
      }
    } catch (e) {
      location.replace("onboarding.html");
      return;
    }
  })();

  function listCases() {
    try {
      if (window.OnTracNative && OnTracNative.listCases) {
        var raw = OnTracNative.listCases();
        var arr = JSON.parse(raw || "[]");
        return Array.isArray(arr) ? arr : [];
      }
    } catch (e) {}
    // browser fallback
    try {
      var ids = JSON.parse(localStorage.getItem("ontrac_case_index") || "[]");
      return ids.map(function (id) {
        try { return JSON.parse(localStorage.getItem("ontrac_case_" + id) || "null"); } catch (e) { return null; }
      }).filter(Boolean);
    } catch (e) { return []; }
  }

  function render() {
    var cases = listCases().filter(function (c) { return c && c.caseId; });
    cases.sort(function (a, b) {
      return (b.updatedAt || b.createdAt || "").localeCompare(a.updatedAt || a.createdAt || "");
    });
    var el = document.getElementById("list");
    if (!cases.length) {
      el.innerHTML = '<p class="empty">No cases yet. Start one — OnTrac carries the work after Approve.</p>';
      return;
    }
    el.innerHTML = cases.map(function (c) {
      var years = (c.years || []).join("–") || "—";
      var stage = c.stage || "—";
      var done = (c.tasks || []).filter(function (t) { return t.status === "done"; }).length;
      var total = (c.tasks || []).length || 0;
      return '<div class="case-row">' +
        '<div><div class="case-title">' + (c.title || "Tax recovery") + '</div>' +
        '<div class="case-meta">' + years + ' · ' + stage + ' · ' + done + '/' + total + ' steps</div></div>' +
        '<button type="button" class="secondary" style="width:auto;padding:10px 14px" data-id="' + c.caseId + '">Open</button></div>';
    }).join("");
    el.querySelectorAll("button[data-id]").forEach(function (btn) {
      btn.onclick = function () {
        location.href = "case.html?id=" + encodeURIComponent(btn.getAttribute("data-id"));
      };
    });
  }

  document.getElementById("btnNew").onclick = function () {
    location.href = "case.html?new=1";
  };

  document.getElementById("btnExport").onclick = function () {
    var cases = listCases().filter(function (c) { return c && c.caseId; });
    var onboarding = null;
    try { onboarding = JSON.parse(localStorage.getItem("ontrac_onboarding_v1") || "null"); } catch (e) {}
    var payload = {
      exportedAt: new Date().toISOString(),
      onboarding: onboarding,
      cases: cases.map(function (c) {
        return { caseId: c.caseId, title: c.title, years: c.years, consent: c.consent || [] };
      })
    };
    var text = JSON.stringify(payload, null, 2);
    try {
      if (window.OnTracNative && OnTracNative.shareOutreach) {
        OnTracNative.shareOutreach("OnTrac consent log export", text);
      } else {
        prompt("Copy consent export", text);
      }
    } catch (e) {
      prompt("Copy consent export", text);
    }
  };
  document.getElementById("btnRules").onclick = function () {
    location.href = "onboarding.html";
  };

  render();
})();
  </script>
</body>
</html>
